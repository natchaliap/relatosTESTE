<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardian Simplificado</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      color: #1f2933;
      text-align: center;
    }

    .hero {
      background: linear-gradient(135deg, #00843d, #00a651);
      color: white;
      padding: 40px 20px;
    }

    .hero h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    img {
      max-width: 300px;
      width: 100%;
      margin: 20px auto;
      display: block;
    }

    button {
      padding: 12px 20px;
      background: #00843d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #006b31;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Guardian Simplificado</h1>
    <p>Registro de Ocorrências</p>
  </div>

  <div class="container">

    <!-- IMAGEM CORRETA -->
    <img src="assets/comportamento.png" alt="Comportamento">

    <button onclick="alert('Botão funcionando!')">
      Registrar ocorrência
    </button>

  </div>

</body>
</html>
