<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123d6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Relatos" />
  <title>Relatos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <section class="card login-card">
      <div class="app-mark">R</div>
      <p class="eyebrow">Acesso ao app</p>
      <h1>Relatos</h1>
      <p class="login-text">Informe sua matrícula para entrar e registrar relatos.</p>

      <form id="loginForm" class="login-form">
        <label>
          Matrícula
          <input id="matriculaLogin" name="matricula" type="text" inputmode="numeric" placeholder="Digite sua matrícula" required autocomplete="username" />
        </label>
        <button class="primary" type="submit">Entrar</button>
      </form>
    </section>
  </div>

  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">PWA de Segurança</p>
        <h1>Relatos</h1>
        <p class="user-line">Matrícula: <strong id="matriculaAtiva"></strong></p>
      </div>
      <div class="top-actions">
        <span class="status" id="onlineStatus">Online</span>
        <button id="sair" class="logout" type="button">Sair</button>
      </div>
    </header>

    <main>
      <section class="card hero">
        <h2>Novo relato</h2>
        <p>Registre rapidamente situações observadas no trabalho.</p>
      </section>

      <form id="reportForm" class="card form-card">
        <label>
          Nome
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required autocomplete="name" />
        </label>

        <label>
          Tipo de relato
          <select id="tipo" name="tipo" required>
            <option value="">Selecione</option>
            <option value="EPIs">EPIs</option>
          </select>
        </label>

        <div id="epiArea" class="hidden">
          <label>
            EPI observado
            <select id="epi" name="epi">
              <option value="">Selecione</option>
              <option>Capacete</option>
              <option>Óculos de proteção</option>
              <option>Luvas</option>
              <option>Protetor auricular</option>
              <option>Calçado de segurança</option>
              <option>Cinto de segurança</option>
              <option>Máscara/respirador</option>
              <option>Outro</option>
            </select>
          </label>

          <p class="field-title">Problema encontrado</p>
          <div class="choice-grid">
            <button type="button" class="choice" data-problema="Não uso">Não uso</button>
            <button type="button" class="choice" data-problema="Uso incorreto">Uso incorreto</button>
          </div>
        </div>

        <label>
          Observação
          <textarea id="observacao" name="observacao" placeholder="Ex.: colaborador sem óculos na área de corte"></textarea>
        </label>

        <input type="hidden" id="problema" name="problema" />
        <button class="primary" type="submit">Salvar relato</button>
      </form>

      <section class="card">
        <div class="section-title">
          <h2>Relatos salvos</h2>
          <button id="limpar" class="ghost" type="button">Limpar</button>
        </div>
        <div id="lista" class="report-list empty">Nenhum relato salvo ainda.</div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" type="button">Relatar</button>
      <button class="nav-item" id="installBtn" type="button" hidden>Instalar app</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
